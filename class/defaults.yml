parameters:
  blackbox_exporter:
    =_metadata:
      multi_instance: true
      multi_tenant: true
      multi_version: true

    namespace: syn-${_instance}
    createNamespace: true

    charts:
      blackbox_exporter: 11.15.1

    helmValues:
      pspEnabled: false
      securityContext:
        runAsUser: null
        runAsGroup: null
